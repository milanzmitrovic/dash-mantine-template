# Define the stages of the pipeline
stages:
  - build
  - test
  - ai

# Build stage
build_job:
  stage: build
  script:
    - echo "Building the project..."
  # Only run this job for merge requests and main branch
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # This will trigger the job for merge requests


# Test stage
test_job:
  stage: test
  script:
    - echo "Running tests..."
  # Make this job dependent on the build stage
  needs:
    - build_job
  # Only run this job for merge requests and main branch
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # This will trigger the job for merge requests

claude:
  stage: ai
  tags:
    - one-sigma-server--runner
  image: node:24-alpine3.21
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_STRATEGY: fetch
    GITLAB_ACCESS_TOKEN: $GITLAB_ACCESS_TOKEN  # Add this line!
  before_script:
    - apk update
    - apk add --no-cache git curl bash
    - npm install -g @anthropic-ai/claude-code
  script:
    - /bin/gitlab-mcp-server || true
    - >
      claude
      -p "${AI_FLOW_INPUT:-'Summarize recent changes and suggest improvements'}"
      --permission-mode acceptEdits
      --allowedTools "Bash(*) Read(*) Edit(*) Write(*) mcp__gitlab"
      --debug
  # Claude Code will use ANTHROPIC_API_KEY from CI/CD variables
      

